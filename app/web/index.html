<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyCare · Flight Recovery Assistant</title>
  <link rel="stylesheet" href="/skycare-assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">SC</div>
      <div>
        <h1 class="brand-title">SkyCare</h1>
        <p class="brand-subtitle" data-i18n="subtitle">Personal Flight Recovery</p>
      </div>
    </div>

    <div class="topbar-actions">
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="es">ES</option>
      </select>
      <button id="newSessionBtn" class="btn btn-outline btn-sm" type="button" data-i18n="newSession">New Chat</button>
    </div>
  </header>

  <main class="passenger-shell" aria-label="Passenger Recovery Chat">
    <div id="chatMessages" class="chat-stream" role="log" aria-live="polite"></div>

    <div class="composer-dock">
      <form id="chatForm" class="composer">
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Ask about your delayed flight, compensation, or hotel support..."
          data-i18n-placeholder="composerPlaceholder"
          required
        ></textarea>
        <button id="sendBtn" class="btn btn-brand composer-send" type="submit" data-i18n="sendBtn">Send</button>
      </form>

      <div class="demo-trigger-row">
        <button
          id="demoToggleBtn"
          class="demo-trigger"
          type="button"
          aria-expanded="false"
          aria-controls="demoPopover"
          data-i18n="demoTrigger"
        >
          Demo ▾
        </button>
        <div id="demoPopover" class="demo-popover" role="menu" hidden></div>
      </div>
    </div>
  </main>

  <script src="/skycare-assets/common.js" defer></script>
  <script src="/skycare-assets/app.js" defer></script>
</body>
</html>
