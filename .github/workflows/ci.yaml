name: CI Quality & Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-typecheck-and-tests:
    name: Lint, Typecheck & Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev --extra lint

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff formatting check
        run: uv run ruff format . --check

      - name: Codespell check
        run: uv run codespell

      - name: Static type check (ty)
        run: uv run ty check .

      - name: Run unit and offline FastAPI E2E tests
        env:
          USE_IN_MEMORY_SESSION: 'true'
        run: uv run pytest tests/unit tests/integration/test_offline_api_e2e.py -v

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deployment/terraform

      - name: Validate single-project Terraform
        run: |
          terraform -chdir=deployment/terraform/single-project init -backend=false
          terraform -chdir=deployment/terraform/single-project validate

      - name: Validate cicd Terraform
        run: |
          terraform -chdir=deployment/terraform/cicd init -backend=false
          terraform -chdir=deployment/terraform/cicd validate
